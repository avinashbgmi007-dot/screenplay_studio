<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat-first — Design Lab</title>
<link rel="stylesheet" href="_lab.css">
<style>
.chat-hero{display:flex;flex-direction:column;height:100vh;padding:46px 0 0}
.chat-hero .chat-wrap{flex:1;min-height:0;max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;padding:14px 20px 0}
.chat-hero .kick{font-family:Consolas,monospace;font-size:10.5px;letter-spacing:.22em;color:var(--lab-muted);text-transform:uppercase;padding:10px 0 6px}
.chat-hero [data-lab-thread]{flex:1;min-height:0;border:1px solid var(--lab-line);border-radius:12px 12px 0 0;background:var(--lab-raised)}
.chat-hero .lab-composer{border:1px solid var(--lab-line);border-top:none;border-radius:0 0 12px 12px;margin-bottom:8px}
.chat-artifact{border:1px solid var(--lab-line);background:var(--lab-panel);border-radius:10px;padding:12px 16px;margin:0 auto 13px;max-width:88%}
.chat-artifact .ak{font-family:Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--lab-accent);text-transform:uppercase;margin-bottom:6px}
.chat-artifact.scene .body{font-size:13.5px;color:var(--lab-muted);font-style:italic}
.chat-artifact .fverbs{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}
.chat-artifact .fverbs button{border:1px solid var(--lab-line);background:var(--lab-void);padding:7px 11px;min-height:38px;font-size:11px}
.chat-artifact .fverbs button:hover{border-color:var(--lab-accent);color:var(--lab-accent)}
.findings-rail{position:fixed;right:0;top:46px;bottom:0;width:300px;background:var(--lab-raised);border-left:1px solid var(--lab-line);z-index:500;transform:translateX(102%);transition:transform .3s ease;display:flex;flex-direction:column}
.findings-rail.open{transform:translateX(0)}
.findings-rail .rail-head{padding:10px 14px;border-bottom:1px solid var(--lab-line);display:flex;align-items:center;gap:8px}
.findings-rail .rail-head h3{font-size:11px;letter-spacing:.16em;color:var(--lab-accent);text-transform:uppercase;font-weight:600}
.findings-rail .rail-head button{margin-left:auto;font-size:10.5px;color:var(--lab-muted)}
.findings-rail .rail-body{flex:1;overflow-y:auto;padding:12px 14px}
.chat-wrap.with-rail{margin-right:312px}
[data-desk]{position:fixed;inset:46px 0 84px;display:none;z-index:600}
.desk-ctl{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);z-index:930;display:flex;gap:6px;background:var(--lab-raised);border:1px solid var(--lab-line);padding:6px;border-radius:99px}
.desk-ctl button{color:var(--lab-muted);border:1px solid var(--lab-line);padding:8px 13px;min-height:36px;border-radius:99px;font-size:11px}
</style>
</head>
<body>

<!-- THE LANDING: Sameer IS the app -->
<div class="chat-hero" data-ia-landing>
  <div class="chat-wrap" data-chat-wrap>
    <div class="kick">Design Lab · IA 2 of 6 · chat-first — Sameer is the home screen. The script and the verdict surface as artifacts in the conversation.</div>
    <div data-lab-thread></div>
    <div class="lab-quote" data-lab-quote hidden>
      <span data-lab-quote-text></span>
      <span class="qsrc" data-lab-quote-src></span>
    </div>
    <div class="lab-composer">
      <textarea data-lab-composer-input rows="1" placeholder="Talk to Sameer — the thread is the app…"></textarea>
      <button class="send" data-lab-composer-send aria-label="Send">↑</button>
    </div>
  </div>
  <aside class="findings-rail" id="findings-rail" aria-label="Verdict rail">
    <div class="rail-head"><h3>The verdict — discuss any finding</h3><button id="rail-close">✕</button></div>
    <div class="rail-body" id="rail-findings" data-findings-surface></div>
  </aside>
</div>

<button data-open-desk style="position:fixed;left:18px;bottom:60px;z-index:520;background:var(--lab-accent);color:#14110e;padding:11px 16px;min-height:44px;font-weight:600;font-size:12.5px;border-radius:99px">Workbench →</button>
<button id="rail-toggle" style="position:fixed;right:18px;bottom:60px;z-index:520;background:var(--lab-panel);color:var(--lab-text);border:1px solid var(--lab-line);padding:11px 16px;min-height:44px;font-size:12.5px;border-radius:99px">Verdict rail</button>

<script>window.LAB_IA = "chat"; window.LAB_PROJECT = null;</script>
<script src="_payload.js"></script>
<script src="_lab.js"></script>
<script>
(function(){
  const $ = Lab.$, $$ = Lab.$$;

  function renderRail(){
    Lab.renderFindingsInto("#rail-findings");
    Lab.wireFindingVerbs("#findings-rail", renderRail);
  }

  // scene artifacts: every scene in the script gets one artifact card the
  // writer can Discuss — chat-first surfaces the script INSIDE the thread
  function renderSceneArtifacts(){
    const thread = $("[data-lab-thread]");
    if (!thread) return;
    const scenes = (Lab.data.parsed || {}).scenes || [];
    thread.insertAdjacentHTML("afterbegin", scenes.slice(0, 3).map(sc => `
      <div class="chat-artifact scene" data-scene="${sc.scene_number}">
        <div class="ak">Script artifact — scene ${sc.scene_number}</div>
        <div class="body">${Lab.esc(sc.heading_raw || "")}</div>
        <div class="fverbs"><button data-verb="locate">open in workbench</button></div>
      </div>`).join(""));
    // finding artifacts
    Lab.fixItems().slice(0, 3).forEach(f => {
      thread.insertAdjacentHTML("beforeend", `
        <div class="chat-artifact finding" data-finding="${f.index}">
          <div class="ak">Verdict artifact — ${Lab.esc(f.category || "")} · severity ${f.severity}</div>
          <div class="body" style="font-size:14px;color:var(--lab-text)">${Lab.esc((f.issue || "").split(". ")[0])}.</div>
          <div class="fverbs">
            <button data-verb="locate">locate</button>
            <button data-verb="discuss">discuss with Sameer</button>
          </div>
        </div>`);
    });
  }

  Lab.onLocate = () => Lab.showDesk(true);
  Lab.onDiscuss = () => { renderRail(); $("#findings-rail").classList.add("open"); $(".chat-wrap").classList.add("with-rail"); };

  Lab.mountChrome();
  Lab.mountDesk(true);
  Lab.boot({
    render(){
      Lab.chatHistory().then(h => Lab.renderThread($("[data-lab-thread]"), h.messages)).catch(() => {});
      renderSceneArtifacts();
      renderRail();
      Lab.wireFindingVerbs(".chat-hero", () => renderRail());
      $("#rail-toggle").addEventListener("click", () => {
        const rail = $("#findings-rail");
        rail.classList.toggle("open");
        $(".chat-wrap").classList.toggle("with-rail", rail.classList.contains("open"));
      });
      $("#rail-close").addEventListener("click", () => {
        $("#findings-rail").classList.remove("open");
        $(".chat-wrap").classList.remove("with-rail");
      });
    }
  });
})();
</script>
</body>
</html>
