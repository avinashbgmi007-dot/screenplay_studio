[build-system]
# Make the repo a real, buildable package: `pip install .` and `pip install
# ".[ci]"` work. setuptools' flat-layout auto-discovery fails here because the
# root holds non-package dirs (tmp*, preview_shots, extracted_text, …), so the
# five real packages are pinned explicitly below.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script-doctor-studio"
version = "0.1.0"
description = "Local, privacy-first screenplay analysis and co-writing studio (parser, analyzer, co-writer, craft knowledge base)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "flask>=3.0.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
# `ruff` is pinned EXACTLY in both extras, and the same pin is repeated in
# .github/workflows/ci.yml (a test asserts the two agree). A floating linter is
# a reproducibility hole of the same kind the pinned `runs-on` guards against: a
# new ruff release can add a rule and fail a green build with no code change, and
# the CI gate can silently disagree with the developer's own `ruff check .`.
dev = ["ruff==0.16.8", "pytest>=8.0"]
stt = ["faster-whisper>=1.0.0"]
# Installed by CI so the full suite is reproducible there, and locally when
# developing. test_pdf_ocr.py imports pypdfium2 directly (no importorskip
# guard); playwright drives the 30 e2e_browser_*.py suites (not collected by
# pytest's default glob). setuptools is here because
# test_packaging_data_files.py *builds* a wheel and an sdist and asserts their
# contents — it needs the build backend importable, not just available to pip's
# isolated build env. Add pytest-cov when coverage runs are wanted.
ci = ["pytest>=8.0", "pytest-asyncio>=0.26", "pytest-cov>=7.1", "playwright>=1.61", "pypdfium2>=4.30", "ruff==0.16.8", "setuptools>=68"]

[tool.setuptools]
packages = ["screenplay_parser", "screenplay_analyzer", "screenplay_cowriter", "screenplay_studio", "knowledge_base"]
# Ship the non-.py assets too. `packages` alone yields a wheel with ZERO data
# files: no craft-rule JSON (the KB degrades *silently* to empty — every report
# loses its "grounded in rule X" claim with no error) and no SPA at all (the
# `/` route 404s). Both are required for `pip install .` to produce a working
# app, so this is a correctness fix, not packaging polish. The setting also
# carries anything MANIFEST.in lists into the wheel, keeping sdist and wheel in
# agreement.
include-package-data = true

[tool.setuptools.package-data]
# 263 attributed craft rules across 26 files, plus the index/schema the loader
# globs for at import time.
knowledge_base = ["*.json", "*.md", "rules/*.json"]
# The SPA and its fonts. There is no build step — these files ARE the artifact,
# so each extension is listed explicitly. `webapp/**/*.<ext>` is recursive: the
# preview-* design labs are still served by the `/<path:filename>` route and are
# exercised by test_preview_lab.py, and they nest two levels deep
# (preview-r4/v2/*.html), so a single-level glob silently drops them.
# Screenshots (*.png) are deliberately excluded: they are evidence artifacts,
# not app assets.
screenplay_studio = [
    "webapp/**/*.html",
    "webapp/**/*.js",
    "webapp/**/*.css",
    "webapp/**/*.woff2",
]


[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs", ".agents", ".claude"]

[tool.ruff.lint]
# Conservative starter set: real errors only (syntax, undefined names,
# unused imports/variables). Widen deliberately as the codebase settles.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests carry exploratory scaffolding (unused fixture imports, one-line
# setup statements); production packages stay fully strict.
"tests/**" = ["F401", "F811", "F841", "E402", "E702", "E741", "F541"]

# Deliberate patterns: deferred sibling-package imports; documented scratch runner.
"_debate.py" = ["E402", "F541"]
"screenplay_studio/demo_model.py" = ["E402"]
"screenplay_studio/webapp_server.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
