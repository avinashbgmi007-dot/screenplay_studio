<!-- GENERATED by build-single.mjs from core.js + ink-layer.js + ink-layer.css + detent.css.
     The two stylesheets are inlined in cascade order: structure first, then the
     colour pass that paints it.
     Do not edit: edit the sources and re-run the bundler.
     This build talks to nothing: with no local studio answering /api/health it
     runs the demo craft adapter, so every mechanism is exercisable offline. -->
<style>
/* =═══════════════════════════════════════════════════════════════════════════
   ink-layer.css — Architecture I: The Ink Layer
   STRUCTURAL ONLY. No colour, no shadow, no ornament, no theme.
   Every rule here exists to make one of three mechanisms legible:
     §A  the single surface + the 12px Horizon
     §B  the dwell-depth accordion fold
     §C  inline take-casting
   Anything not load-bearing for structure/flow/state is deliberately absent.
   Colour is a later pass and must slot in WITHOUT this file changing shape.
   =═══════════════════════════════════════════════════════════════════════════ */

/* ── §0 DIMENSIONS ─────────────────────────────────────────────────────── */

:root{
  /* The only three numbers the layout is built from. */
  --horizon-w: 12px;                       /* the track, exactly, as specified   */
  --horizon-hit: 24px;                     /* pointer target; the track stays 12 */
  --page-pad: clamp(12px, 4.2vw, 72px);
  --scrollbar-w: 12px;                     /* gutter reserved for the native bar */

  /* Structural type metrics. The face is a system stack only because a
     monospace advance width is what makes column alignment deterministic.
     Choosing a real face is a styling decision and is NOT made here. */
  --script-face: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --script-size: 1rem;
  --script-leading: 1.5;

  --fold-ms: 260ms;                        /* mirrors FOLD_MS in core.js */
  --focus-ring: 2px solid currentColor;
  --focus-offset: 2px;

  /* Single continuous surface: the manuscript owns the viewport and the page
     itself scrolls. No nested scroller, no second scroll context. */
  --measure: 72ch;
}

/* Reduced motion: the fold state machine is unaffected (it is state, not
   motion) — only the transition is muted, so opening still settles identically. */
@media (prefers-reduced-motion: reduce){
  :root{ --fold-ms: 0ms; }
}

/* ── §A THE SINGLE SURFACE ─────────────────────────────────────────────── */

html, body{ margin:0; padding:0; }
html{ scrollbar-gutter: stable; }          /* the layout never shifts when ink appears */

/* The manuscript is the scroller. Nothing else in this document scrolls. */
.surface{
  /* padding-right reserves the 12px track + its own breath, so no glyph can
     ever be occluded by the Horizon at any width. */
  padding: var(--page-pad);
  padding-right: calc(var(--page-pad) + var(--horizon-w) + (var(--page-pad) / 2));
  scrollbar-width: thin;
}
@media (max-width: 720px){
  .surface{ padding-right: var(--horizon-w); }        /* track rides the edge */
}

/* The manuscript column: centered, fixed measure. Centering is FLEX-BASED
   (margin:auto) and not allowed to collapse when the Horizon is interactive,
   because the Horizon is absolutely positioned and takes no flow space. */
.manuscript{
  margin-inline: auto;
  width: min(100%, var(--measure));
  font-family: var(--script-face);
  font-size: var(--script-size);
  line-height: var(--script-leading);
  tab-size: 4;
}

/* Rows. One element per screenplay element. The DOM text is the real text —
   leading whitespace included — so the manuscript in the DOM is the manuscript. */
.row{
  display: block;
  white-space: pre-wrap;                   /* real indentation, no sentinel hacks */
  position: relative;
  scroll-margin-block: 8rem;               /* keyboard focus never lands under the fold */
  outline: none;                           /* replaced by [data-focus] below */
}
.row:focus-visible,
.rowgroup[data-focus] > .row{
  outline: var(--focus-ring);
  outline-offset: var(--focus-offset);
}

/* Element-type alignment. Structural: it expresses the screenplay's own
   grammar (action flush, speech indented) and gives the fold its column. */
.row[data-type="action"],
.row[data-type="scene_heading"],
.row[data-type="shot"],
.row[data-type="transition"],
.row[data-type="general"]{ --indent: 0ch; }
.row[data-type="character"]{ --indent: 22ch; }
.row[data-type="parenthetical"]{ --indent: 18ch; }
.row[data-type="dialogue"]{ --indent: 14ch; }
.row[data-type="transition"]{ text-align: right; }

/* Indentation is applied by ink-layer.js from the SAME map that sets --indent,
   so the text and the fold column can never disagree. See INDENT in core.js. */

.scene{ display: block; }
.scene > .rowgroup > .row[data-type="scene_heading"]{ margin-block: 1.6em .8em; }
.row + .rowgroup > .row{ margin-block: .35em 0; }

/* ── §A2 INK STATES — structure only, no colour ────────────────────────── */

/* WET: the row is unsettled. A left rule whose THICKNESS is the severity and
   whose STYLE is the verification state. Both are non-colour channels. */
.rowgroup[data-ink="wet"]{
  border-inline-start: 1px solid currentColor;
  padding-inline-start: 1ch;
  margin-inline-start: -1ch;
}
.rowgroup[data-ink="wet"][data-worst="critical"]{ border-inline-start-width: 6px; }
.rowgroup[data-ink="wet"][data-worst="major"]   { border-inline-start-width: 3px; }
.rowgroup[data-ink="wet"][data-worst="minor"]   { border-inline-start-width: 1px; }
.rowgroup[data-flagged="true"]                  { border-inline-start-style: dashed; }

/* ADDRESSED: dry. The mark is a change-star in the margin, not a colour. */
.rowgroup[data-ink="dry"] > .row::after{
  content: "★"; font-size: .7em; vertical-align: super;
  margin-inline-start: .5ch; opacity: .7;
}
/* GHOSTED by the ink threshold: present, receded, still readable and still
   focusable. Never display:none — "ghost, don't hide". */
/* THE INK THRESHOLD SOFTENS CRITIQUE MARKS — NEVER THE MANUSCRIPT.
   Prose legibility is absolute: a screenplay's text is always at full contrast,
   because dimming it impairs reading and hides the context that judgement needs.
   Below the floor, the CRITICISM steps back: its rule thins to a dotted hairline,
   its horizon pip shrinks, and its fold stops opening on a dwell. The line still
   reads perfectly, and Enter still opens it when the writer asks. */
.rowgroup[data-quiet="true"]{
  border-inline-start-style: dotted;
  border-inline-start-width: 1px;
}
.rowgroup[data-quiet="true"] > .row{ opacity: 1; }        /* prose is never faded */
.rowgroup[data-quiet="true"] > .row::after{ opacity: .5; } /* the change-star recedes */

/* ── §B THE DWELL-DEPTH ACCORDION FOLD ─────────────────────────────────── */

/* The rowgroup is a two-track grid: the line, then the fold.
   Collapsed = 0fr. The fold participates in layout at all times, so opening it
   PUSHES the following rows down instead of covering them. */
.rowgroup{
  display: grid;
  grid-template-rows: auto 0fr;
  transition: grid-template-rows var(--fold-ms) linear;
}
.rowgroup[data-fold="open"],
.rowgroup[data-fold="pinned"],
.rowgroup[data-fold="closing"]{ grid-template-rows: auto 1fr; }
.rowgroup[data-fold="closing"]{ grid-template-rows: auto 0fr; }  /* collapse */

/* The grid item must be allowed to shrink and must clip its own overflow,
   or 0fr cannot reach zero height. */
.rowgroup > .fold{ min-height: 0; overflow: hidden; }

/* The fold opens in the SAME COLUMN as the line it belongs to. --indent is set
   on .rowgroup by the renderer from the shared INDENT map. */
.fold{
  margin-inline-start: var(--indent, 0ch);
  border-inline-start: 2px solid currentColor;   /* attaches the fold to its line */
}
.fold-pad{ padding: .5em 1ch .75em; display: grid; gap: .75em; }

/* The findings inside one fold STACK in severity order. The stack is the whole
   reason there is no findings list: N findings on a line is still ONE fold. */
.finds{ list-style: none; margin: 0; padding: 0; display: grid; gap: .6em; }
.find{
  display: grid;
  grid-template-columns: 1fr auto;         /* text | provenance chip */
  gap: .1em .75em;
  padding-inline-start: 1ch;
  border-inline-start: 1px solid currentColor;
}
.find[data-verified="false"]{ border-inline-start-style: dashed; }
.find[data-provenance="measured"]{ font-style: italic; }   /* no craft authority claimed */
.find-issue{ grid-column: 1; }
.find-evidence{ grid-column: 1; white-space: pre-wrap; opacity: .8; }
.find-evidence::before{ content: "“"; }
.find-evidence::after{ content: "”"; }
.find-sig{ grid-column: 2; grid-row: 1 / span 2; white-space: nowrap; opacity: .7; }
.find-overflow{ grid-column: 1 / -1; opacity: .7; }

/* ── §C INLINE TAKE-CASTING ────────────────────────────────────────────── */

/* While casting, the LIVE row is the control. No overlay, no popup, no panel,
   and — since the trap frame — no writing into the row either: an audition is a
   reading, and the line changes only when a take is committed. The underline
   states that the line is the subject of what is in the fold; data-delta is the
   line reporting whether it currently holds a change (it does not, mid-audition). */
.rowgroup[data-cast="active"] > .row{ text-decoration: underline; text-underline-offset: .25em; }
.rowgroup[data-cast="active"] > .row[data-delta="true"]{ text-decoration-style: double; }

/* THE STRIP IS A STACK, IN THE FOLD'S OWN COLUMN, and its order is the
   progressive disclosure it promises: where this take sits, then the takes,
   then the scope the desk answered with, then its reason, then the keys. One
   fluid column: nothing here needs a second reading position, and nothing here
   is laid out for one viewport width only. */
.casting{
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: .3em;
  border-top: 1px solid currentColor;
  padding-top: .5em;
}
.casting > *{ margin: 0; }
.cast-ledger{ white-space: nowrap; }
.cast-key{ white-space: nowrap; }

/* THE TAKES: number, sentence, arithmetic — the three things a take is. The
   number column is 4ch so ORIG and 01..09 align without a second look; the
   sentence takes the rest and wraps at word boundaries; the delta stays on its
   own take's baseline and never wraps away from it. */
.cast-takes{ list-style: none; padding: 0; display: grid; gap: .25em; }
.take{ display: grid; grid-template-columns: 4ch minmax(0, 1fr) auto; gap: 1ch; align-items: baseline; }
.tk-n{ font-variant-numeric: tabular-nums; }
.tk-text{ white-space: pre-wrap; overflow-wrap: anywhere; }
.tk-delta{ font-style: normal; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Type as the change: struck for what goes, underlined for what arrives, and
   never a colour alone. */
.tk-text del{ text-decoration: line-through; }
.tk-text ins{ text-decoration: underline; text-underline-offset: .22em; }

/* The one editable slice of the strip, and it is only ever the passage itself:
   the frame's prefix and suffix are shown as text, never as fields. */
.tk-fix{ white-space: pre-wrap; }
.tk-edit{ white-space: pre-wrap; outline: none; border-bottom: 1px dashed currentColor; }
.tk-edit:focus-visible{ border-bottom-style: solid; }

.cast-scope{ white-space: normal; }
.rowgroup[data-cast="busy"]{ cursor: progress; }

/* ── §A3 THE HORIZON (12px, absolute, true proportion) ─────────────────── */

/* No layout impact at all: fixed, out of flow, so the single surface can never
   be squeezed by its own radar.
   FIXED, not absolute — an absolutely positioned element resolves against the
   initial containing block, which is viewport-height, so the track would only
   represent the first screenful. The Horizon must span the viewport and map the
   WHOLE document into itself: that is what "true proportion" requires. */
.horizon{
  position: fixed;
  inset-block: 0;
  inset-inline-end: 0;
  width: var(--horizon-w);
  z-index: 3;
  touch-action: none;                      /* pointer drag is the scrub */
  user-select: none;
}
.horizon:focus-visible{ outline: var(--focus-ring); outline-offset: -2px; }

/* One child g that IS the coordinate system: 0..trackHeight px == 0..scrollHeight. */
.hz-track{ display: block; width: 100%; height: 100%; }

/* Scene bands: true proportion, integer-tiled, always ≥1px. Structural rule =
   a hairline between bands; altitude within the story is conveyed by position
   and height alone. */
.hz-band{ stroke: currentColor; stroke-width: .5; opacity: .5; }
.hz-band[data-scene]:hover{ opacity: 1; }
.hz-band[data-current="true"]{ opacity: 1; stroke-width: 1; }

/* Ink pips: the track is 12px wide; a pip's WIDTH is the severity (core.js
   inkPx 0/4/8/12) and its inline position is the severity channel. */
.hz-ink rect{ fill: currentColor; }
.hz-ink[data-flagged="true"] rect{ fill: none; stroke: currentColor; stroke-width: .6; }
.hz-ink[data-dismissed="true"] rect{ opacity: .35; }

/* The window: the viewport's true extent. Drawn, never interactive itself —
   the whole track is the drag surface. */
.hz-window{ fill: none; stroke: currentColor; stroke-width: 1; opacity: .6; }

/* The dry meter: the only place a progress figure lives, and it is text in the
   annunciator, never a floating badge. */

/* ── §D THE ANNUNCIATOR — the only non-manuscript text in the document ─── */

/* Visually hidden in the shipped design, but structurally present: it is what
   makes the whole architecture readable with the screen off. Not a toolbar,
   not a status bar, takes no space, contains no controls. */
.annunciator{
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip-path: inset(50%);
  white-space: nowrap;
}
.annunciator[data-show="true"]{
  /* Opt-in visible mode for keyboard-only writers; still bottom-anchored and
     out of flow so it can never displace the manuscript. */
  position: fixed; inset-inline: 0; inset-block-end: 0;
  width: auto; height: auto; margin: 0; clip-path: none;
  padding: .5em 1ch;
  z-index: 4;
}

/* ── §E PRINT: the ink layer is strictly a screen concern ──────────────── */

@media print{
  .horizon, .annunciator{ display: none !important; }
  .rowgroup{ grid-template-rows: auto 0fr !important; }
  .rowgroup[data-ink]{ border: 0 !important; }
  .rowgroup[data-ink="dry"] > .row::after{ content: ""; }
  .rowgroup[data-quiet="true"]{ border-inline-start-style: solid; }
  .surface{ padding-right: var(--page-pad); }
}

/* =═══════════════════════════════════════════════════════════════════════════
   detent.css — The Detent, as the colour pass over ink-layer.css
   ════════════════════════════════════════════════════════════════════════════
   This file exists because ink-layer.css says so in its own header:

       "STRUCTURAL ONLY. No colour, no shadow, no ornament, no theme. …
        Colour is a later pass and must slot in WITHOUT this file changing shape."

   So: NOTHING here changes a dimension, a track count, a state machine or a
   transition owner. Every rule paints an element the structural sheet already
   created, or typesets text the renderer already wrote. If a rule below needs a
   new element to exist, the element is added in the renderer (ink-layer.js) and
   noted in the comment — never invented in CSS with ::before content that has no
   source in the DOM.

   THE LAW THIS PASS ENCODES
     · The manuscript is the only thing at full ink. Prose is NEVER dimmed — not
       by the ink threshold, not by an unverified finding, not by quiet.
     · Colour separates INK STATE (wet · dry · receded), never severity.
       Severity is width (structural) + solid ▪ blocks (here). `--accent` is
       reserved for critical and for nothing else.
     · Evidence is a FILAMENT: a 1px lit rule under the quote, peaking at
       #FFD9A0, blooming amber beneath. Lit, not printed.
     · No fills behind text. The fold is a machined SLOT (inset groove), not a
       card, a panel or a chip.
     · Two grounds, one design: `data-ground="instrument"` (as designed) and
       `data-ground="lifted"` (the same instrument raised off black). Switching
       the attribute changes six values and nothing else.

   Kinetic profile: the precision detent. Fold opens 220ms cubic-bezier(.16,1,.3,1),
   closes 150ms; the swap dialect is `step` — 90ms, one discrete colour step
   through wet ink, no interpolation. All of it collapses under reduced motion.
   =═══════════════════════════════════════════════════════════════════════════ */

/* ── §D0 TOKENS ───────────────────────────────────────────────────────────── */

:root{
  /* the bench */
  --desk:      #150807;   /* canvas                                  */
  --leaf:      #22100E;   /* the lacquered leaf                      */
  --slot:      #190B0A;   /* a machined groove (fold interiors)      */
  /* the ink */
  --ink:       #F0E5D4;   /* warm ivory — text                        */
  --wet:       #E3A653;   /* wet ink: unsettled, being worked         */
  --fil:       #FFD9A0;   /* filament core — the hot centre of a lit rule */
  --under:     #D9973C;   /* filament body                            */
  --broken:    #8A6A55;   /* unverified stitch · settled · void       */
  --accent:    #D9593C;   /* critical only. Never a label, never a fill */
  --brass:     rgba(201,158,94,.42);   /* the hairline                */
  --brass-2:   rgba(201,158,94,.20);

  /* type: the instrument's three voices */
  --iface: "DM Sans", system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif;
  --serif: "Instrument Serif", Georgia, "DejaVu Serif", serif;
  --script-face: "Courier Prime", "Courier New", ui-monospace, "DejaVu Sans Mono", monospace;

  /* kinetics (the structural sheet's --fold-ms is respected, not replaced) */
  --fold-open-ms: 220ms;
  --fold-close-ms: 150ms;
  --settle: cubic-bezier(.16,1,.3,1);
  --step-ms: 90ms;
}

/* The lifted ground: the same instrument, raised off black so it holds up at
   low panel brightness and in daylight. Six values, no other difference — the
   point is that the design does not depend on the darkness. */
:root[data-ground="lifted"]{
  --desk:   #241a12;
  --leaf:   #2b1e15;
  --slot:   #2e2018;
  --brass:  rgba(214,176,116,.46);
  --brass-2: rgba(214,176,116,.22);
  --broken: #9A7A63;
}

/* ── §D1 THE BENCH ────────────────────────────────────────────────────────── */

html, body{ background: var(--desk); color: var(--ink); }

/* One worklight, low and warm, off the top-left. This is the page's ground, not
   a highlight: it never sits behind a line, it never moves, and it carries no
   meaning. */
body::before{
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(720px 520px at 8% -6%, rgba(227,166,83,.055), transparent 62%),
    radial-gradient(900px 700px at 92% 108%, rgba(217,89,60,.022), transparent 60%);
}
.surface, .manuscript{ position: relative; z-index: 1; }

::selection{ background: rgba(255,217,160,.16); color: var(--ink); }

/* The scrollbar is part of the bench, not the browser's default furniture. */
html{ scrollbar-color: rgba(201,158,94,.32) transparent; }
html::-webkit-scrollbar{ width: 12px; }
html::-webkit-scrollbar-thumb{ background: rgba(201,158,94,.28); }
html::-webkit-scrollbar-track{ background: transparent; }

/* Focus: the detent's click, made visible. Brass, never the accent. */
:root{ --focus-ring: 2px solid var(--under); --focus-offset: 3px; }

/* ── §D2 THE MANUSCRIPT ───────────────────────────────────────────────────── */

/* The script face, with the studio's self-hosted Courier Prime first if the
   page has it and the system stack otherwise. No network, no webfont fetch. */
.manuscript{
  font-family: var(--script-face);
  color: var(--ink);
  font-variant-ligatures: none;
}

/* Scene headings are rows of the manuscript (structural), so they are typed as
   manuscript: same face, a hair more tracking, a brass rule under the heading —
   the one ornament this pass spends on the page, because it is the only line
   that is both prose and structure. */
.row[data-type="scene_heading"]{
  letter-spacing: .02em;
  border-block-end: 1px solid var(--brass-2);
  padding-block-end: .35em;
}
.row[data-type="transition"]{ color: var(--ink); opacity: .82; }

/* Prose is always at full ink. This is asserted rather than assumed: any future
   rule that fades a row is a bug against the product law. */
.row{ opacity: 1; }

/* ── §D3 INK STATES — colour carries STATE; width carries SEVERITY ────────── */

/* WET: this line is being worked. Amber rule; the rule's WIDTH is the severity
   (set structurally) and its COLOUR is the state (set here). */
.rowgroup[data-ink="wet"]{ border-inline-start-color: var(--wet); }
.rowgroup[data-ink="wet"][data-worst="critical"]{ border-inline-start-color: var(--accent); }
/* FLAGGED: the quote could not be located — the stitch is dashed (structural)
   and broken-brown (here). "Not proven" must not look like "wrong". */
.rowgroup[data-flagged="true"]{ border-inline-start-color: var(--broken); }

/* DRY: the change-star appears (structural). It is wet ink that has settled.
   TWO INKS, and the page says which: a line that went dry because the desk
   LOCATED its evidence settles in wet ink (--wet); a line the writer closed by
   their own decision settles in brass (--brass) — the instrument's own colour,
   because no evidence was offered and none is implied. Same state, same
   geometry: only who resolved it is painted. */
.rowgroup[data-ink="dry"] > .row::after{ color: var(--wet); opacity: .85; }
.rowgroup[data-ink="dry"][data-dry="choice"] > .row::after{ color: var(--brass); }
.rowgroup[data-ink="dry"][data-dry="choice"]{ border-inline-start-color: var(--brass); }
.rowgroup[data-ink="dry"][data-dry="evidence"]{ border-inline-start-color: var(--wet); }

/* RECEDED by the ink threshold: the CRITIQUE steps back, the prose does not.
   Structural already thins the rule to a dotted hairline and never fades the
   row; here the critique loses its colour, nothing else. */
.rowgroup[data-quiet="true"]{ border-inline-start-color: rgba(138,106,85,.55); }
.rowgroup[data-quiet="true"] > .row::after{ color: var(--broken); }

/* The row being cast is the control: its own text is the proposed text. */
.rowgroup[data-cast="active"] > .row{
  text-decoration: underline;
  text-decoration-color: var(--under);
  text-decoration-thickness: 1px;
  text-underline-offset: .28em;
}
/* A take that differs from the original gets the double rule (structural) in
   the filament's body colour — the delta is visible without being scored. */
.rowgroup[data-cast="active"] > .row[data-delta="true"]{ text-decoration-color: var(--fil); }
.rowgroup[data-cast="busy"] > .row{ text-decoration-color: var(--brass); }

/* THE SWAP DIALECT: `step`. One discrete 90ms colour step through wet ink and
   out — the swap CLICKS instead of sliding. Under reduced motion the line
   simply arrives at its final colour, which is the same state. */
@media (prefers-reduced-motion: no-preference){
  .rowgroup[data-cast="active"] > .row{ animation: detent-step var(--step-ms) steps(2, jump-none) 1; }
  .rowgroup[data-cast="applied"] > .row{ animation: detent-step var(--step-ms) steps(2, jump-none) 1; }
}
@keyframes detent-step{
  0%   { color: var(--wet); }
  100% { color: var(--ink); }
}

/* STALE: the server refused the proposal because the line moved under it. The
   row is the writer's own text again, untouched, and the refusal is recorded in
   the fold (see .cast-void) — the page is never marked as if a write happened. */
.rowgroup[data-cast="stale"]{ border-inline-start-color: var(--broken); }

/* ── §D4 THE FOLD — a machined slot, never a card ─────────────────────────── */

/* The kinetic profile, expressed as durations on the SAME transition the
   structural sheet owns. Nothing new transitions; only how long it takes. */
@media (prefers-reduced-motion: no-preference){
  .rowgroup{ transition-duration: var(--fold-close-ms); }
  .rowgroup[data-fold="open"],
  .rowgroup[data-fold="pinned"]{ transition-duration: var(--fold-open-ms); transition-timing-function: var(--settle); }
}
@media (prefers-reduced-motion: reduce){
  :root{ --fold-open-ms: 0ms; --fold-close-ms: 0ms; --step-ms: 0ms; }
}

/* The groove: inset top and bottom so the fold reads as milled into the bench
   rather than laid on top of it. The leading hairline attaches it to its line
   (the attachment is structural; only its colour is set here). */
.fold{
  border-inline-start-color: var(--brass);
  background: var(--slot);
  box-shadow:
    inset 0 1px 0 rgba(255,235,215,.055),
    inset 0 -1px 0 rgba(0,0,0,.55);
}
.fold-pad{ font-family: var(--iface); }

/* ── §D5 THE FINDINGS — commentary in the instrument's voice, quotes in the
        manuscript's ───────────────────────────────────────────────────────── */

.find{ border-inline-start-color: var(--brass); }
.find[data-verified="false"]{ border-inline-start-color: var(--broken); }

/* The issue is written, not printed: instrument face, comfortable leading. */
.find-issue{
  font-family: var(--iface);
  font-size: .92em;
  line-height: 1.5;
  letter-spacing: .002em;
  color: var(--ink);
}
/* The quote is the writer's own words, so it is set in the writer's own face,
   and it wears the filament. The rule is 1px and the bloom is small: evidence
   should read as lit, not as selected. */
.find-evidence{
  font-family: var(--script-face);
  font-size: .9em;
  opacity: 1;
  background-image: linear-gradient(90deg,
    rgba(217,151,60,0), rgba(217,151,60,.55) 30%, var(--fil) 50%, rgba(217,151,60,.55) 70%, rgba(217,151,60,0));
  background-repeat: no-repeat;
  background-size: 100% 1px;
  background-position: 0 calc(100% - 1px);
  padding-bottom: 2px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.find[data-verified="false"] .find-evidence{
  background-image: linear-gradient(90deg, rgba(138,106,85,0), rgba(138,106,85,.75), rgba(138,106,85,0));
}

/* The signature line: letterspaced, tabular, quiet — and severity as SOLID
   BLOCKS in --grav, which is the only place severity is drawn. The word stays
   next to the blocks (it is the accessible label); the blocks are the glyph. */
.find-sig{
  font-family: var(--iface);
  font-size: .72em;
  text-transform: uppercase;
  letter-spacing: .18em;
  font-variant-numeric: tabular-nums;
  color: var(--grav, #8A6A55);
  opacity: .95;
}
.find[data-severity="minor"] .find-sig::before{ content: "▪ "; color: var(--broken); }
.find[data-severity="major"] .find-sig::before{ content: "▪▪ "; color: var(--broken); }
.find[data-severity="critical"] .find-sig::before{ content: "▪▪▪ "; color: var(--accent); }
.find-overflow{ font-family: var(--iface); font-size: .82em; color: var(--broken); opacity: 1; }

/* A measured (deterministic) finding claims no craft authority — structural
   italicises it; here it also loses the filament: no evidence, no lit rule. */
.find[data-provenance="measured"] .find-evidence{
  background-image: linear-gradient(90deg, rgba(138,106,85,0), rgba(138,106,85,.45), rgba(138,106,85,0));
}

/* ── §D6 THE CAST STRIP — an instrument reading, in the fold ────────────────
   SEAM NOTE, corrected: an earlier revision of this note declared the strip's
   PLACEMENT here, on the grounds that ink-layer.css forbade the change. It does
   not — that sheet is structural only, and a grid template IS structure; what it
   forbids is colour and ornament, which is exactly what stays in this file. The
   strip's geometry (one column, the take's three columns, the wrap rules) now
   lives in ink-layer.css §C, where it belongs, and this pass paints: the
   ledger's own type, the two inks a take can carry, the struck and the
   underlined change, the void. Nothing here touches a dimension. */

.casting{ border-top-color: var(--brass); font-family: var(--iface); }
/* The strip is read as an instrument, not as screenplay: it takes the interface
   leading (1.5) instead of the manuscript's double spacing, so the ledger, the
   takes, the scope and the keys sit together as one reading rather than four
   separate paragraphs. Nothing about the manuscript changes. */
.casting > p{ line-height: 1.5; }
.cast-key{
  font-size: .72em; text-transform: uppercase; letter-spacing: .18em;
  color: var(--under); opacity: 1;
}
/* THE TAKE LEDGER — the readout, printed as text: `TAKE 02 / 03   ● ○ ○   +29 −00`.
   The three spans are the renderer's own children (.ldg-pos, .ldg-marks,
   .ldg-delta); the delta is ARITHMETIC on the take against the passage it was cut
   from — characters added and removed — so it is a measurement, never a score.
   Tabular, so the counter cannot jitter as it steps. */
.cast-ledger{
  display: inline-flex; gap: .9ch; align-items: baseline;
  font-family: var(--script-face);
  font-size: .78em; letter-spacing: .22em; text-transform: uppercase;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.cast-ledger .ldg-pos{ color: var(--under); letter-spacing: .3em; }
.cast-ledger .ldg-marks{ letter-spacing: .3em; color: var(--wet); }
.cast-ledger .ldg-delta{ color: var(--broken); letter-spacing: .12em; }

/* THE TAKES, PAINTED. The number is a label, not a score: the desk's proposals
   carry the wet ink's own body colour, and the writer's own line — ORIG — is
   labelled in the quieter one, because it is not a proposal at all. The delta is
   arithmetic in the void's colour: what moved, not how good it is. */
.take .tk-n{ color: var(--broken); }
.take[data-original="true"] .tk-n{ color: var(--under); }
.tk-text{ font-family: var(--script-face); color: var(--ink); }
.tk-delta{ color: var(--broken); letter-spacing: .12em; }
.take[data-current="true"] .tk-n{ color: var(--wet); }
/* The take under the keys is marked by a filament under the words themselves —
   the same rule the ink uses elsewhere, done in type here because the take is
   not the manuscript and must never wear the manuscript's marks. */
.take[data-current="true"] .tk-text{
  text-decoration: underline; text-decoration-color: var(--fil); text-underline-offset: .28em;
}
/* The change, in the manuscript's own inks: what goes is struck in the colour
   of a settled line, what arrives is underlined in the filament's. */
.tk-text del{ text-decoration-color: var(--broken); }
.tk-text ins{ text-decoration-color: var(--fil); }
/* The frame around the editable slice: read-only text is quiet, the hole is lit.
   AND ONLY ONE MARK AT A TIME: the take's filament underline comes off while the
   writer is typing, so the provisional rule is the only thing claiming the
   passage — the mark that says "this is the proposal" and the mark that says
   "this is yours to write" must never be the same mark. */
.tk-fix{ color: var(--under); opacity: .75; }
.tk-edit{ color: var(--ink); border-bottom-color: var(--brass); }
.tk-edit:focus{ border-bottom-color: var(--under); }
.casting[data-editing="true"] .take[data-current="true"] .tk-text{ text-decoration: none; }
.casting[data-editing="true"] .take[data-current="true"] .tk-n{ color: var(--under); }

.cast-scope{ font-size: .74em; letter-spacing: .16em; text-transform: uppercase; color: var(--under); }
.cast-meta{ font-size: .76em; letter-spacing: .06em; color: var(--broken); opacity: 1; }
/* A dependency between proposals is a finding about the EXCHANGE, not about the
   prose — and not a severity. It gets a lit rule, not the accent: the accent
   means CRITICAL and nothing else, or it stops meaning anything. */
.cast-overlap{ font-size: .8em; line-height: 1.55; color: var(--ink); border-left: 2px solid var(--under); padding-left: 1ch; }
.cast-skipped{ font-size: .78em; color: var(--broken); opacity: 1; }
.cast-busy{ font-size: .78em; color: var(--under); opacity: 1; }

/* The void notice: a refused proposal, recorded where the proposal was. */
.cast-void{
  font-size: .82em; line-height: 1.55;
  color: var(--ink);
  border-top: 1px dashed var(--broken);
  padding-top: .5em;
}
.cast-void b{ font-weight: 500; color: var(--broken); text-transform: uppercase; letter-spacing: .16em; font-size: .92em; }
/* The keys are the last line of the strip and sit in the flow of it: they are a
   reading, not a toolbar. Placement travels with the element that introduced it. */
.cast-keys{ display: flex; gap: 1ch; flex-wrap: wrap; margin: 0; }
.cast-keys .cast-meta{ letter-spacing: .04em; }

/* ── §D7 THE HORIZON ──────────────────────────────────────────────────────── */

.hz-band{ stroke: var(--brass); opacity: .55; }
.hz-band[data-scene]:hover{ opacity: 1; stroke: var(--under); }
.hz-band[data-current="true"]{ opacity: 1; stroke: var(--wet); }
.hz-ink rect{ fill: var(--wet); }
.hz-ink[data-severity="critical"] rect{ fill: var(--accent); }
.hz-ink[data-flagged="true"] rect{ fill: none; stroke: var(--broken); }
.hz-window{
  stroke: var(--fil); stroke-width: 1; opacity: .85;
  fill: rgba(255,217,160,.05);
}

/* ── §D8 THE ANNUNCIATOR (visible mode) ───────────────────────────────────── */

/* When the writer opts in with `a`, this is the one strip of interface text in
   the document — so it is styled as the instrument's plate: slot ground, brass
   hairline, small letterspaced type, tabular figures. */
.annunciator[data-show="true"]{
  font-family: var(--iface);
  font-size: .82rem; letter-spacing: .04em;
  color: var(--ink);
  background: var(--slot);
  box-shadow: inset 0 1px 0 rgba(255,235,215,.05);
  border-top: 1px solid var(--brass);
}

/* ── §D9 PRINT — the Detent is a screen concern ───────────────────────────── */

@media print{
  html, body{ background: #fff; color: #111; }
  /* The manuscript is printed as ink on paper, in one colour. Every type voice
     this sheet gives a tint is forced back to black here: the rows are painted
     by more specific selectors than `body`, so inheriting a colour is not enough
     — light amber on white paper is a page nobody can read. */
  .manuscript, .row, .row[data-type]{ color: #111; }
  .row[data-type="character"], .row[data-type="dialogue"]{ color: #111; }
  body::before{ display: none; }
  .find-evidence{ background-image: none; padding-bottom: 0; }
  .fold{ background: none; box-shadow: none; }
  .find-sig{ color: #555; }
  .hz-band, .hz-window{ stroke: #999; }
  .hz-ink rect{ fill: #444; }
}

</style>
</head>
<body>
  <main class="surface" id="surface">
    <article class="manuscript" id="manuscript" role="document" aria-label="Screenplay manuscript" aria-busy="true"></article>
  </main>
  <div class="horizon" id="horizon" role="slider" tabindex="0" aria-orientation="vertical"
       aria-label="Document horizon: scene proportion, ink, and viewport position"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Top of script">
    <svg class="hz-track" id="hzTrack" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <g id="hzBands"></g><g id="hzInk"></g>
      <rect id="hzWindow" class="hz-window" x="0" width="100%" height="0"></rect>
    </svg>
  </div>
  <p class="annunciator" id="annunciator" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript><p style="padding:2rem">The Ink Layer needs scripting enabled.</p></noscript>
<script type="module">
/**
 * core.js — DOM-free primitives for Architecture I: The Ink Layer.
 *
 * Everything in this file is pure: no DOM, no network, no timers.
 * Unit-tested by tests/core.test.mjs (node --test) exactly like webapp/core.js.
 *
 * The three mechanisms of the architecture map to three sections here:
 *   §1  row traversal + Horizon geometry      (spatial logic)
 *   §2  dwell + fold state machine            (temporal logic)
 *   §3  take-casting string math + adapters   (mutation logic)
 *   §4  the keymap arbitration table          (input precedence)
 */

/* ══════════════════════════════════════════════════════════════════════════
   §0  CONSTANTS
   ══════════════════════════════════════════════════════════════════════════ */

/** Dwell before the fold blooms. Interaction primitive — not an animation delay. */
const DWELL_MS = 420;

/** Fold transition. Kept separate from DWELL_MS so reduced-motion can mute one. */
const FOLD_MS = 260;

/** Severity is an ordered scale everywhere in the system. */
const SEV_ORDER = ['none', 'minor', 'major', 'critical'];
const SEV_RANK = { none: 0, minor: 1, major: 2, critical: 3 };

/**
 * THE DESK SPEAKS TWO VOCABULARIES. The findings a study emits carry
 * critical | major | minor; the summary route reports by_severity as
 * high | major | medium | low. Reading only ours scored every `high` finding as
 * `none` — no mark, no pip width, no severity at all — and a critique that
 * silently ranks an urgent note as noise is worse than no critique. The four
 * labels collapse onto the three marks by ORDER, and the collapse is stated
 * rather than hidden: `medium` and `low` are both the single mark.
 * (Open question for the product: whether the two middle tiers deserve their
 * own mark — see OPEN_QUESTIONS.md.)
 */
const SEV_ALIAS = {
  critical: 'critical', blocker: 'critical', high: 'critical',
  major: 'major', medium: 'minor', moderate: 'minor',
  minor: 'minor', low: 'minor', none: 'none',
};
const canonSev = (s) => SEV_ALIAS[String(s ?? 'none').trim().toLowerCase()] ?? 'none';
const sevRank = (s) => SEV_RANK[canonSev(s)];
const sevAtLeast = (s, floor) => sevRank(s) >= (Number(floor) || 0);

/** Horizontal mass of the ink pip inside the 12px track, in px. Geometry, not colour. */
const INK_PX = { none: 0, minor: 4, major: 8, critical: 12 };
const inkPx = (worst) => INK_PX[canonSev(worst)] ?? 0;

/**
 * How many findings are ever authored into one fold. Bounds the fold's height.
 */
const MAX_FINDS_PER_FOLD = 6;

/**
 * Column geometry of the screenplay grammar, in character cells.
 * THE SINGLE SOURCE OF TRUTH for indentation: the renderer composes the row
 * text from this map AND sets the fold's --indent from it, so the critique can
 * never open in a different column from the line it belongs to.
 */
const INDENT = {
  scene_heading: 0, action: 0, shot: 0, transition: 0, general: 0,
  character: 22, parenthetical: 18, dialogue: 14,
};
const CHARS_PER_SCREENPLAY_INCH = 10; // Courier 12pt, for width math later
const indentOf = (type) => INDENT[type] ?? 0;

/** The renderer owns leading whitespace: element text is stripped on the way in
 *  and re-indented deterministically, so source drift cannot double-indent. */
const stripLead = (text) => String(text ?? '').replace(/^[ \t]+/, '');
const indentText = (type, text) => ' '.repeat(indentOf(type)) + stripLead(text);

/* ══════════════════════════════════════════════════════════════════════════
   §0b THE STUDIO'S CAPABILITY TOKEN
   ══════════════════════════════════════════════════════════════════════════
   The webapp's write guard (webapp_server._reject_cross_origin_writes) refuses
   every POST that does not carry `X-Studio-Token` when a token is configured,
   and hands the page its licence as the `studio_token` cookie — NOT HttpOnly,
   precisely so the page's own script can echo it. A prototype served by the
   studio on the same origin therefore has to do the same thing, or every write
   it makes comes back 403 while every read succeeds: the exact "looked
   authenticated until the write" failure the server's own comment names.
   Pure functions, so the rule is testable without a server.
*/
const STUDIO_TOKEN_COOKIE = 'studio_token';

/** Read one cookie's value out of a `document.cookie` string, or null. */
function tokenFromCookie(cookieHeader, name = STUDIO_TOKEN_COOKIE) {
  const raw = String(cookieHeader ?? '');
  for (const part of raw.split(';')) {
    const eq = part.indexOf('=');
    if (eq < 0) continue;
    if (part.slice(0, eq).trim() !== name) continue;
    const v = part.slice(eq + 1).trim();
    return v ? decodeURIComponent(v) : null;
  }
  return null;
}

/** The headers a write carries: JSON, plus the page's licence when it has one. */
function writeHeaders(cookieHeader, name = STUDIO_TOKEN_COOKIE) {
  const token = tokenFromCookie(cookieHeader, name);
  return token ? { 'Content-Type': 'application/json', 'X-Studio-Token': token }
               : { 'Content-Type': 'application/json' };
}

/* ══════════════════════════════════════════════════════════════════════════
   §1  ROW TRAVERSAL + HORIZON GEOMETRY
   ══════════════════════════════════════════════════════════════════════════ */

function clampIndex(i, len) {
  if (len <= 0) return -1;
  return Math.max(0, Math.min(len - 1, i));
}

/** Step one row. Clamped, not wrapping: the ends are real places. */
function stepIndex(i, len, delta) {
  if (len <= 0) return -1;
  return Math.max(0, Math.min(len - 1, i + delta));
}

/**
 * Nearest "wet" row in a direction. Steps off `from` first, so pressing n
 * while already on a wet row advances to the *next* wet row rather than
 * re-firing the current one. Returns -1 at the extreme (caller announces).
 */
function nearestWet(rows, from, dir) {
  const n = rows.length;
  if (!n) return -1;
  let i = from + dir;
  while (i >= 0 && i < n) {
    if (rows[i].wet) return i;
    i += dir;
  }
  return -1;
}

/** Index of the row whose `lineStart` matches, else the nearest row after it. */
function rowForLine(rows, lineStart) {
  if (lineStart == null) return -1;
  let best = -1;
  for (let i = 0; i < rows.length; i++) {
    const l = rows[i].lineStart;
    if (l == null) continue;
    if (l === lineStart) return i;
    if (l < lineStart) best = i;
  }
  return best;
}

/**
 * True-proportion scene bands for the 12px track.
 *
 * Integer accumulation guarantees the three invariants the Horizon depends on:
 *   • bands tile the track exactly (Σ h === trackHeight, no gaps, no overlaps)
 *   • tops are monotonically non-decreasing
 *   • every band is at least `minBandPx` tall (a 1-page scene stays clickable)
 *
 * `boxes` are content-space rects: { key, top, height } in px, already measured.
 * `domain` is the measured extent the track represents (scrollHeight or the
 * content box — see measure() in ink-layer.js).
 */
function sceneBands(boxes, domain, trackHeight, { minBandPx = 1 } = {}) {
  const H = Math.max(1, domain);
  const T = Math.max(1, Math.round(trackHeight));
  if (!boxes.length) return [];
  const out = [];
  let prevBottom = 0;
  for (let i = 0; i < boxes.length; i++) {
    const b = boxes[i];
    const isLast = i === boxes.length - 1;
    let top = Math.round((b.top / H) * T);
    top = Math.max(prevBottom, Math.min(T - 1, top));
    const natural = isLast ? T : Math.round(((b.top + b.height) / H) * T);
    let bottom = Math.min(T, Math.max(natural, top + minBandPx));
    if (bottom - top < 1) bottom = Math.min(T, top + 1);
    out.push({
      key: b.key,
      topPx: top,
      hPx: bottom - top,
      topPct: (top / T) * 100,
      hPct: ((bottom - top) / T) * 100,
      page: b.page ?? null,
    });
    prevBottom = bottom;
  }
  return out;
}

/** Viewport window rect for the track, in track px. */
function windowRect(scrollTop, clientHeight, scrollHeight, trackHeight) {
  const H = Math.max(1, scrollHeight);
  const T = Math.max(1, trackHeight);
  const top = (Math.max(0, scrollTop) / H) * T;
  const h = Math.max(8, (clientHeight / H) * T); // 8px floor keeps the window grabbable
  return { topPx: top, hPx: h };
}

/** Inverse: track y → scrollTop that puts that document position in view. */
function scrubTo(trackY, clientHeight, scrollHeight, trackHeight, { center = false } = {}) {
  const H = Math.max(1, scrollHeight);
  const T = Math.max(1, trackHeight);
  const ratio = Math.max(0, Math.min(1, trackY / T));
  const target = ratio * H - (center ? clientHeight / 2 : 0);
  return Math.max(0, Math.min(H - clientHeight, target));
}

/** Bucket findings into per-scene ink channels. Tolerant of payload shapes. */
function inkChannels(findings, { includeDismissed = false } = {}) {
  const map = new Map();
  for (const f of findings || []) {
    if (f.dismissed && !includeDismissed) continue;
    const refs = Array.isArray(f.scene_refs) && f.scene_refs.length ? f.scene_refs
      : (f.scene != null ? [f.scene] : []);
    for (const s of refs) {
      const c = map.get(s) || { scene: s, worst: 'none', open: 0, addressed: 0, flagged: 0 };
      if (f.status === 'addressed') {
        c.addressed += 1;
      } else {
        c.open += 1;
        // The channel's `worst` is the CANONICAL word (see SEV_ALIAS): the pip
        // geometry and the CSS both read this value, and a desk that spells the
        // same weight `high` must not produce a severity the page has no mark for.
        if (sevRank(f.severity) > sevRank(c.worst)) c.worst = canonSev(f.severity);
      }
      if (isFlagged(f)) c.flagged += 1;
      map.set(s, c);
    }
  }
  return map;
}

/** A finding is flagged when the verifier could not land its quote (0.72 gate). */
function isFlagged(f) {
  if (f.verification && typeof f.verification === 'object' && f.verification.status) {
    return f.verification.status !== 'verified';
  }
  if (typeof f.verified === 'boolean') return f.verified === false;
  if (typeof f.verification === 'string') return f.verification !== 'verified';
  return false;
}

/** Provenance: attributed craft rule vs. mechanical deterministic pass. */
function provenanceOf(f) {
  if (f.check_id) return 'measured';
  if (f.rule_id) return 'attributed';
  return 'unknown';
}

/**
 * The one counting contract (mirrors app.js findingDisposition): every surface
 * reads open/addressed/flagged from here, so the radar and the fold can never
 * disagree about the same finding.
 */
function inkTotals(findings, { includeDismissed = false } = {}) {
  let open = 0, addressed = 0, flagged = 0, dismissed = 0;
  for (const f of findings || []) {
    if (f.dismissed) { dismissed += 1; if (!includeDismissed) continue; }
    if (f.status === 'addressed') addressed += 1; else open += 1;
    if (isFlagged(f)) flagged += 1;
  }
  return { open, addressed, flagged, dismissed };
}

/** Canonical /findings/summary reader. Unknown fields are `null`, never guessed. */
function normalizeSummary(payload) {
  const s = payload || {};
  const t = s.totals || {};
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
  const pick = (...vals) => {
    for (const v of vals) if (v !== undefined && v !== null) return v;
    return null;
  };
  /* The route's own names come FIRST where they differ: GET /findings/summary
     answers { open_count, done_count, dismissed_count, by_status }, and
     `still_present + unknown` is exactly the open set that arithmetic uses.
     Reading only the legacy names made the drift check silently blind against a
     real studio — a reconciliation that can never disagree is not a check. */
  const byStatus = s.by_status || t.by_status || null;
  const sumStatus = (a, b) => (byStatus ? (Number(byStatus[a]) || 0) + (Number(byStatus[b]) || 0) : null);
  return {
    dawnPct: num(pick(s.dawn_pct, s.dawn, t.dawn_pct)),
    open: num(pick(s.open, t.open, s.open_count, sumStatus('still_present', 'unknown'))),
    addressed: num(pick(s.addressed, t.addressed, s.done_count, byStatus && Number(byStatus.addressed))),
    dismissed: num(pick(s.dismissed, t.dismissed, s.dismissed_count)),
    flagged: num(pick(s.flagged, t.flagged)),
    bySeverity: s.by_severity || t.by_severity || null,
    /** Capability flag: the summary carries per-scene buckets → the radar can
     *  paint the whole track from ONE call. Detected at boot, never assumed. */
    byScene: s.by_scene || s.byScene || t.by_scene || null,
  };
}

/**
 * Reconcile client-side buckets against the server's summary. The server number
 * WINS (the client is a cache); drift is reported so the UI can say so out loud
 * rather than quietly disagreeing with itself.
 */
function reconcileInk(channels, summary) {
  const local = { open: 0, addressed: 0, flagged: 0 };
  for (const c of (channels instanceof Map ? channels.values() : Object.values(channels || {}))) {
    local.open += c.open; local.addressed += c.addressed; local.flagged += c.flagged;
  }
  const s = normalizeSummary(summary);
  // delta is SERVER − CLIENT. Positive means the client's cache is behind the
  // server (it has not seen the newest findings yet): stale, not wrong.
  const cmp = (server, client) => (server == null ? null : server - client);
  const delta = { open: cmp(s.open, local.open), addressed: cmp(s.addressed, local.addressed), flagged: cmp(s.flagged, local.flagged) };
  const drift = Object.values(delta).some((d) => d !== null && d !== 0);
  return { local, server: s, delta, drift, authority: 'server' };
}

/* ══════════════════════════════════════════════════════════════════════════
   §2  DWELL + FOLD STATE MACHINE
   ══════════════════════════════════════════════════════════════════════════ */

/**
 * Fold lifecycle. Data-attribute values on .rowgroup, in order.
 *   closed → armed → open → closing → closed
 * `pinned` is orthogonal: an open fold that the writer claimed with Enter/click,
 * which therefore no longer closes when the pointer leaves or focus moves.
 */
const FOLD_STATE = ['closed', 'armed', 'open', 'closing'];

function foldNext(state, event) {
  const T = {
    closed: { arm: 'armed', open: 'open' },
    armed: { cancel: 'closed', fire: 'open' },
    open: { close: 'closing' },
    closing: { settle: 'closed' },
  };
  return (T[state] || {})[event] || state;
}

/**
 * Does the fold's growth need a scroll correction to keep the focused LINE
 * stationary? Only when something above the line changes height: closing a
 * fold that sits above the focused row. Growth below the line never moves it.
 */
function scrollCorrection({ closingHeightPx, closingTopPx, focusTopPx }) {
  const above = closingTopPx + closingHeightPx <= focusTopPx;
  return above ? -Math.max(0, closingHeightPx) : 0;
}

/**
 * Keep the focused row fully in the viewport after a fold opens, moving the
 * scroll ONLY by the overflow. scrollIntoView would move the line itself.
 */
function overflowCorrection({ rowTop, rowBottom, foldBottom, viewTop, viewBottom }) {
  if (foldBottom > viewBottom) return foldBottom - viewBottom;
  if (rowTop < viewTop) return rowTop - viewTop;
  return 0;
}

/* ══════════════════════════════════════════════════════════════════════════
   §3  TAKE-CASTING — string math + payload adapters
   ══════════════════════════════════════════════════════════════════════════ */

/**
 * Capture the immutable frame a cast composes into: prefix + target + suffix.
 * The frame is captured ONCE per line per cast session. Never re-frame a line
 * you have already composed — that is how J→K→J accumulates text.
 *
 * Returns null when the evidence quote does not occur in the live line: the
 * candidate is not castable, and the caller must say so rather than guess.
 */
function frameOf(text, target) {
  if (typeof text !== 'string' || typeof target !== 'string' || !target) return null;
  const at = text.indexOf(target);
  if (at < 0) return null;
  return {
    at,
    prefix: text.slice(0, at),
    target,
    suffix: text.slice(at + target.length),
    original: text,
    /** The quote occurs more than once — cast it, but say it is ambiguous. */
    ambiguous: text.indexOf(target, at + 1) >= 0,
  };
}

/** The single composition function. Pure string replacement, no DOM. */
function composeLine(frame, candidateText) {
  if (!frame) return null;
  return frame.prefix + String(candidateText ?? '') + frame.suffix;
}

/** Byte-exact restore, by construction: the original was never mutated. */
function restoreLine(frame) {
  return frame ? frame.original : null;
}

/** Take ring position. Clamped by default; `wrap` is opt-in, never implicit. */
function stepRing(i, len, delta, { wrap = false } = {}) {
  if (len <= 0) return -1;
  /* A RING OF len + 1 PLACES. Position -1 is not "nothing selected": it is the
     writer's own line, and it is the zero point the first take is reached from
     and returned to. The ring therefore clamps at -1 and at len - 1 — the ends
     are real places (your line; the last take), not silent failures. */
  const n = i + delta;
  if (wrap) return ((n + 1) % (len + 1) + (len + 1)) % (len + 1) - 1;
  return Math.max(-1, Math.min(len - 1, n));
}

/* ══════════════════════════════════════════════════════════════════════════
   §3a  ANCHORING — a finding is placed by its quote, never by a line number
   ══════════════════════════════════════════════════════════════════════════
   The contract is unambiguous (contracts_UI §3.2): `line_start` "is an unstable
   parameter that drifts during edit loops", and every critique must ground on a
   fuzzy match (threshold 0.72) against `evidence_quote`. The renderer used to
   place findings by substring or fall back to the scene's first row, which meant
   a quote repeated in two places, or reworded slightly, attached to whatever
   line happened to be first. So: score every row in the finding's scenes, take
   the best match at or above the threshold, and when two rows are close enough
   to be a coin toss, SAY SO and never pick silently.
*/
const ANCHOR_THRESHOLD = 0.72;
const normQ = (t) => String(t ?? '').toLowerCase()
  .replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();

/**
 * Quote↔text similarity in 0..1. Containment is a match (a located quote is the
 * strongest evidence there is); otherwise Sørensen–Dice over character bigrams,
 * which tolerates the small rewordings that make line numbers useless.
 */
function fuzzyScore(quote, text) {
  const a = normQ(quote), b = normQ(text);
  if (!a || !b) return 0;
  if (b.includes(a)) return 1;
  if (a.length < 3) return 0;
  const grams = (str) => {
    const m = new Map();
    for (let i = 0; i < str.length - 1; i++) {
      const g = str.slice(i, i + 2);
      m.set(g, (m.get(g) || 0) + 1);
    }
    return m;
  };
  const ga = grams(a), gb = grams(b);
  let hit = 0, total = 0;
  for (const [g, n] of ga) { total += n; hit += Math.min(n, gb.get(g) || 0); }
  for (const [, n] of gb) total += n;
  return total ? (2 * hit) / total : 0;
}

/**
 * Place one finding against the rows of its own scenes.
 * Returns { rowIndex, score, exact, ambiguous, loose } — never a silent guess:
 *   exact      the quote is contained in the row (score 1)
 *   ambiguous  two rows scored within `tie` of each other; `hint` (line_start)
 *              breaks the tie when it can, and the caller must say it did
 *   loose      nothing reached the threshold: the finding stays SCENE-anchored
 *              (shown, never dropped, and never re-pointed at a line it cannot
 *              prove it belongs to)
 */
function anchorFinding(rows, finding, { threshold = ANCHOR_THRESHOLD, tie = 0.04 } = {}) {
  const refs = Array.isArray(finding?.scene_refs) && finding.scene_refs.length
    ? finding.scene_refs
    : (finding?.scene != null ? [finding.scene] : []);
  const pool = [];
  rows.forEach((r, i) => {
    if (refs.length && !refs.includes(r.scene)) return;
    pool.push({ i, score: fuzzyScore(finding?.evidence, r.baseText ?? r.text) });
  });
  const inScene = pool.length ? pool : rows.map((r, i) => ({ i, score: 0 }));
  if (!inScene.length) return { rowIndex: -1, score: 0, exact: false, ambiguous: false, loose: true };
  inScene.sort((a, b) => (b.score - a.score) || (a.i - b.i));
  const best = inScene[0];
  const rivals = inScene.filter((c) => c !== best && best.score - c.score <= tie);
  const hintIdx = finding?.line_start != null
    ? rows.findIndex((r) => r.lineStart === finding.line_start) : -1;
  if (best.score < threshold) return { rowIndex: -1, score: best.score, exact: false, ambiguous: false, loose: true };
  if (!rivals.length) return { rowIndex: best.i, score: best.score, exact: best.score >= 1, ambiguous: false, loose: false };
  const hinted = [best, ...rivals].find((c) => c.i === hintIdx);
  return { rowIndex: (hinted || best).i, score: best.score, exact: best.score >= 1, ambiguous: true, loose: false };
}

/* ══════════════════════════════════════════════════════════════════════════
   §3b  REHEARSAL — the comparison mechanic, chosen by what is being compared
   ══════════════════════════════════════════════════════════════════════════
   Rehearsal is a MODE of the strip, not a second surface. Which mechanic it
   uses is decided by the material, not by the writer's preference:

     voice  (dialogue, character cue, parenthetical)  → TEMPORAL
            takes are heard one at a time, on a beat, because the thing being
            judged is a rhythm you can only judge in time.
     space  (action, scene heading, shot, transition) → SPATIAL
            takes are stacked side by side with their size, because the thing
            being judged is how much text a line loses, and a deletion that
            only passes on the beat is a deletion nobody noticed.

   Their constraint is honoured literally: because temporal comparison alone
   can hide subtle deletions, the stack is always readable for a voice row too
   — the fold keeps the read-only diff, and the ledger states the delta against
   the passage. The beat is a reading pace, not an animation, so it is NOT
   disabled under reduced motion; only the strip's colour steps are.
*/
const REHEARSAL_BEAT_MS = 1400;
const VOICE_TYPES = new Set(['dialogue', 'character', 'parenthetical']);
const rehearsalMode = (type) => (VOICE_TYPES.has(type) ? 'temporal' : 'spatial');

/**
 * One beat of the audition. Ring positions run -1 (the writer's own line) ..
 * count - 1, so the reading starts at take 1, and -1 means "the reading is
 * over" — a sentinel, because a completed reading is not the same state as
 * never having started, and the caller must announce them differently.
 */
function rehearsalStep({ ring, count }) {
  if (!(count > 0)) return -1;
  const next = ring + 1;
  return next < count ? next : -1;
}

/* ══════════════════════════════════════════════════════════════════════════
   §3c  THE PROPOSAL — what a take is, what it would read as, how it differs
   ══════════════════════════════════════════════════════════════════════════ */

/**
 * Word-level change map between the line as it stands and the line as it would
 * read. Returns segments { op: '=' | 'del' | 'ins', text }; whitespace rides
 * with the words so the renderer can print the result as a sentence.
 *
 * This is the answer to "writers can identify what was deleted, added, and
 * preserved" — the count in the ledger says how much moved, this says what.
 * Longest-common-subsequence over tokens: O(n·m) on a line of ≤ a few hundred
 * words, and it never throws on empty or identical sides.
 */
function diffWords(before, after) {
  const tok = (t) => String(t ?? '').split(/(\s+)/).filter((x) => x !== '');
  const words = (t) => tok(t).filter((x) => !/^\s+$/.test(x));
  const A = words(before), B = words(after);
  const n = A.length, m = B.length;
  const key = (w) => w.toLowerCase();
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = key(A[i]) === key(B[j])
        ? dp[i + 1][j + 1] + 1
        : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const out = [];
  const push = (op, text) => {
    const last = out[out.length - 1];
    if (last && last.op === op) last.text += text;
    else out.push({ op, text });
  };
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (key(A[i]) === key(B[j])) { push('=', A[i] + ' '); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { push('del', A[i] + ' '); i++; }
    else { push('ins', B[j] + ' '); j++; }
  }
  while (i < n) { push('del', A[i] + ' '); i++; }
  while (j < m) { push('ins', B[j] + ' '); j++; }
  for (const seg of out) seg.text = seg.text.replace(/\s+$/, '');
  return out.filter((seg) => seg.text !== '');
}

/**
 * The class the desk answered with, stated as scope. A scene-level request must
 * not look like a guaranteed single-line operation: if the response carried the
 * scene's text or proposals for more than one passage, the strip says so.
 */
function scopeOf(norm, row) {
  const takes = (norm?.takes || []).filter((t) => t && t.candidates && t.candidates.length);
  const frames = takes.reduce((n, t) => n + t.candidates.length, 0);
  const mine = row ? takes.filter((t) => takeForRow([t], { lineStart: row.lineStart, text: row.text })) : takes;
  const kind = norm?.sceneText ? 'scene' : (takes.length > 1 ? 'line' : 'passage');
  return { kind, passages: takes.length, frames, onThisLine: mine.length };
}

/** Do any two proposals rewrite overlapping text? Independence is never assumed. */
function targetSpans(text, takes) {
  const spans = [];
  for (const t of takes || []) {
    if (!t?.oldText) continue;
    let at = String(text ?? '').indexOf(t.oldText);
    while (at >= 0) {
      spans.push({ start: at, end: at + t.oldText.length, take: t });
      at = String(text).indexOf(t.oldText, at + 1);
    }
  }
  return spans.sort((a, b) => a.start - b.start);
}
function overlappingTargets(text, takes) {
  const spans = targetSpans(text, takes);
  // Overlap only matters between DIFFERENT proposals; repeats of one proposal are
  // the ambiguity question, not the dependency question.
  const byTake = new Map();
  for (const sp of spans) {
    const list = byTake.get(sp.take) || [];
    list.push(sp);
    byTake.set(sp.take, list);
  }
  const flat = [...byTake.values()].map((list) => list[0]);
  for (let a = 0; a < flat.length; a++) {
    for (let b = a + 1; b < flat.length; b++) {
      if (flat[a].start < flat[b].end && flat[b].start < flat[a].end) return true;
    }
  }
  return false;
}

/**
 * Direct editing of the provisional text — recomposed from the captured frame,
 * never re-framed from the mutated line. The frame is the writer's original
 * passage: whatever they type is dropped into that hole, so a typed proposal can
 * never accumulate the previous proposal.
 */
function editProposal(frame, typed) {
  const text = String(typed ?? '').replace(/\s+/g, ' ').trim();
  if (!frame) return { ok: false, reason: 'no frame to edit' };
  if (!text) return { ok: false, reason: 'empty' };
  if (text === frame.target) return { ok: false, reason: 'unchanged' };
  return { ok: true, text, composed: composeLine(frame, text) };
}

/** Characters added and removed between two strings, as the ledger prints them. */
function deltaOf(before, after) {
  const d = String(after ?? '').length - String(before ?? '').length;
  return { added: d > 0 ? d : 0, removed: d < 0 ? -d : 0, net: d };
}

/* ── the context filter: critique recedes, prose never does ────────────────── */

const SCOPE_KINDS = ['all', 'scene', 'category', 'status'];
function nextScope(scope, ctx = {}) {
  const at = SCOPE_KINDS.indexOf(scope?.kind || 'all');
  for (let step = 1; step <= SCOPE_KINDS.length; step++) {
    const kind = SCOPE_KINDS[(at + step) % SCOPE_KINDS.length];
    if (kind === 'all') return { kind: 'all', value: null };
    if (kind === 'scene' && ctx.scene != null) return { kind, value: ctx.scene };
    if (kind === 'category' && ctx.category) return { kind, value: ctx.category };
    if (kind === 'status') return { kind, value: 'open' };
  }
  return { kind: 'all', value: null };
}
function inScope(f, scope, ctx = {}) {
  if (!scope || scope.kind === 'all') return true;
  if (scope.kind === 'scene') {
    const refs = Array.isArray(f?.scene_refs) && f.scene_refs.length ? f.scene_refs : (f?.scene != null ? [f.scene] : []);
    return refs.includes(scope.value ?? ctx.scene);
  }
  if (scope.kind === 'category') return f?.category === scope.value;
  if (scope.kind === 'status') return scope.value === 'open' ? f?.status !== 'addressed' : f?.status === scope.value;
  return true;
}
/** A row's critique is quiet when it is below the floor OR outside the filter. */
function quietRow(row, floor, scope, ctx = {}) {
  if (!row || row.worst === 'none' || !row.finds || !row.finds.length) return false;
  if (floor > 0 && sevRank(row.worst) < floor) return true;
  return !row.finds.some((f) => inScope(f, scope, ctx));
}

/** The nearest OTHER scene a finding cites, for "visit related passage". */
function relatedScene(f, currentScene) {
  const refs = Array.isArray(f?.scene_refs) && f.scene_refs.length ? f.scene_refs : (f?.scene != null ? [f.scene] : []);
  return refs.find((s) => s !== currentScene) ?? null;
}

/**
 * The apply response carries the recomputed findings state (contracts_UI §2.D):
 *   { scene_number, scene_text_after, findings_status: { summary, findings:[{index,status}] } }
 * So the page does not have to guess how a written edit changed the critique,
 * and does not have to make two more round trips to find out.
 */
function statusPatch(res) {
  const fs = res && res.findings_status;
  if (!fs || typeof fs !== 'object') return null;
  const byIndex = new Map();
  for (const f of fs.findings || []) {
    if (f && f.index != null && f.status) byIndex.set(Number(f.index), String(f.status));
  }
  return { byIndex, summary: fs.summary || null };
}

/**
 * Normalise POST /rewrite into the shape the casting layer consumes.
 * Tolerant of the several plausible field names because the route map only
 * promises "replacement candidates for a scene". Anything unusable is
 * reported in `skipped` with a reason — flag, don't drop.
 */
const KNOWN_REWRITE_KEYS = ['replacements', 'targets', 'lines', 'candidates', 'takes', 'scene_text', 'note'];
const REWRITE_UNKNOWN =
  'the response carried none of the fields this desk answers with (replacements, targets, lines, candidates, scene_text, note)';

function normalizeRewrite(payload) {
  const p = payload || {};
  /* A VALIDATED ENVELOPE, NOT AN OPTIMISTIC ONE. The tolerant reader below can
     only be safe while it is reading something it recognises; anything else is
     reported as unrecognised and the strip fails loudly, because guessing the
     structure of a reply is how a valid replacement ends up attached to the
     wrong text (Ashna's required correction). */
  const known = p && typeof p === 'object' && KNOWN_REWRITE_KEYS.some((k) => k in p);
  /* THE REAL CONTRACT, first because it is now the only thing the route sends:
       { scene_number, note, replacements: [{ old, new }], scene_text }
     A frame is not a take: it is ONE candidate for a passage, cut from the
     exact bytes it proposes to replace and applied by that match. Takes are
     therefore built by GROUPING the frames — every frame that names the same
     `old` is an alternate for the same passage, so it becomes another candidate
     in that passage's ring, and the ring keeps working exactly as the UI
     promises (J/K auditions, Enter applies one frame) while the wire stays
     one-frame-per-edit. Frames naming different passages stay separate takes.
     The legacy branches below stay: the contract was unknown when they were
     written and a tolerant reader costs nothing. */
  const frames = Array.isArray(p.replacements) ? p.replacements : null;
  if (frames && frames.some((r) => r && typeof r === 'object'
       && typeof r.old === 'string' && typeof r.new === 'string')) {
    const byOld = new Map();
    const takes = [];
    const skipped = [];
    for (const f of frames) {
      const flat = f && typeof f === 'object'
        && typeof f.old === 'string' && typeof f.new === 'string';
      if (!flat) { skipped.push({ id: skipped.length, reason: 'not an {old, new} frame' }); continue; }
      if (!f.old.trim() || !f.new.trim()) { skipped.push({ id: skipped.length, reason: 'frame has an empty side' }); continue; }
      if (f.old === f.new) { skipped.push({ id: skipped.length, reason: 'frame proposes no change' }); continue; }
      let take = byOld.get(f.old);
      if (!take) {
        take = { lineStart: f.line_start ?? null, elIndex: null, oldText: f.old,
                 findingId: f.finding_id ?? null, candidates: [], skipped: [] };
        byOld.set(f.old, take);
        takes.push(take);
      }
      if (take.candidates.some((c) => c.text === f.new)) continue;   // a repeat is not a take
      take.candidates.push({
        id: take.candidates.length, text: f.new,
        ruleId: f.rule_id ?? null, checkId: f.check_id ?? null,
        confidence: typeof f.confidence === 'number' ? f.confidence : null,
      });
    }
    return { scene: p.scene_number ?? p.scene ?? null, note: p.note ?? '',
             sceneText: p.scene_text ?? null, takes, skipped, unknown: false };
  }
  const raw = p.targets || p.lines || p.replacements || p.candidates || [];
  const list = Array.isArray(raw) ? raw : [];
  const takes = [];
  for (const r of list) {
    const cands = r.candidates || r.options || r.takes || [];
    const arr = Array.isArray(cands) ? cands : [];
    const skipped = [];
    const candidates = [];
    arr.forEach((c, i) => {
      const text = typeof c === 'string' ? c : (c.text ?? c.new_text ?? c.line ?? '');
      const reason = c.skipped_reason ?? c.reason ?? null;
      if (reason || !text) { skipped.push({ id: c.id ?? i, reason: reason || 'empty candidate' }); return; }
      candidates.push({
        id: c.id ?? c.take ?? i,
        text,
        ruleId: c.rule_id ?? r.rule_id ?? null,
        checkId: c.check_id ?? r.check_id ?? null,
        confidence: typeof c.confidence === 'number' ? c.confidence : null,
      });
    });
    takes.push({
      lineStart: r.line_start ?? r.lineStart ?? null,
      elIndex: r.el_index ?? r.elIndex ?? null,
      oldText: r.old_text ?? r.oldText ?? r.target_text ?? '',
      findingId: r.finding_id ?? r.findingId ?? null,
      candidates,
      skipped,
    });
  }
  if (!known) {
    return { scene: null, note: '', sceneText: null, takes: [], skipped: [],
             unknown: true, reason: REWRITE_UNKNOWN };
  }
  return { scene: p.scene ?? p.scene_number ?? null, takes, skipped: [], unknown: false };
}

/** Pick the take record that belongs to a row. Exact line_start first, then text. */
function takeForRow(takes, { lineStart, text }) {
  const byLine = (takes || []).find((t) => t.lineStart != null && t.lineStart === lineStart);
  if (byLine) return byLine;
  return (takes || []).find((t) => t.oldText && text && text.includes(t.oldText)) || null;
}

/**
 * Body of the POST /edits/apply request for one cast take.
 *
 * THE REAL CONTRACT (webapp_server `apply_edits`, hardened):
 *     { scene_number, replacements: [{ old, new }] }
 * `old` is the frame's captured target — the exact bytes the take was cut from
 * — and the route refuses the WHOLE proposal with
 *     {"error": "Stale proposal: the text was modified manually.", "stale": true}
 * when those bytes are no longer what the working copy holds at the moment the
 * lock is taken. That refusal is the writer's protection, not an error to paper
 * over; `classifyApplyError` below turns it into a decision, and the DOM layer
 * answers it by putting the writer's own text back on the page.
 */
function applyPayload({ sceneNumber, take, frame, candidate }) {
  return {
    scene_number: sceneNumber ?? null,
    replacements: [{
      old: frame ? frame.target : (take?.oldText ?? ''),
      new: candidate?.text ?? '',
    }],
  };
}

/**
 * One decision point for a failed apply. The DOM layer must never string-match
 * a server message, so the two 400 bodies the route can return are classified
 * here — they are contract, not accident:
 *   stale   the text moved under the proposal. NOTHING was written; the page is
 *           the writer's own text and asking again is the recovery.
 *   frames  a malformed replacement frame: the desk's bug, not the writer's.
 *   failed  anything else (network, 404, a dead studio).
 */
function classifyApplyError(err) {
  const body = err && typeof err.body === 'object' && err.body ? err.body : null;
  const message = (body && (body.error || body.message)) || (err && err.message) || 'Unknown error';
  if (body && body.stale === true) return { kind: 'stale', message, recoverable: true };
  if (err && err.status === 400 && /require string fields/.test(message)) {
    return { kind: 'frames', message, recoverable: false };
  }
  return { kind: 'failed', message, recoverable: true };
}

/**
 * One shape for findings, from either envelope the desk can hand back:
 *   live   GET /findings → { items: [...], count }   (items carry `index`,
 *          `evidence_quote`, `status` ∈ addressed|still_present|unknown)
 *   demo   the offline adapter → { findings: [...] } (the shape the renderer
 *          was written against, which predates the route map being read)
 * Missing is a legitimate empty; nothing is invented for a field the server did
 * not send. `evidence_quote` is the same fact as `evidence` under the name the
 * route actually uses.
 */
function normalizeFindings(payload) {
  const list = Array.isArray(payload) ? payload
    : (payload && (payload.findings || payload.items)) || [];
  return (Array.isArray(list) ? list : []).map((f, i) => ({
    ...f,
    index: f.index ?? i,
    evidence: f.evidence ?? f.evidence_quote ?? '',
    status: f.status ?? 'open',
  }));
}

/** A cast is only committable when nothing else is in flight. */

/* ══════════════════════════════════════════════════════════════════════════
   §5  KEYMAP ARBITRATION
   Exactly one listener owns the keyboard. This table is the whole contract;
   the DOM layer only executes what it returns.
   ══════════════════════════════════════════════════════════════════════════ */

/**
 * @param {{key:string, metaKey?:boolean, ctrlKey?:boolean, altKey?:boolean, shiftKey?:boolean}} ev
 * @param {{editing:boolean, casting:boolean, foldOpen:boolean, onHorizon:boolean}} ctx
 * @returns {string} action id
 *
 * Precedence, highest first:
 *   0. editing        — THE CARET IS ABSOLUTE. Every key passes through, including
 *                       Mod+Z: while a caret exists, undo belongs to the words the
 *                       writer is typing, not to the app's edit stack. The app's
 *                       undo stack only answers once the line is committed.
 *   1. chord          — Mod-based commands (undo/redo) survive every non-editing state
 *   2. Escape         — peels one layer: cast → fold → release focus
 *   3. casting        — j/k/Enter own the ring; a step abandons the preview.
 *                       J/K inside an OPEN fold begins casting (that is the entry
 *                       point: casting is never summoned, it grows from the line)
 *   4. horizon        — when the track has focus it is a scrollbar
 *   5. traversal      — arrows step rows, n/p step wet rows, [ ] set ink floor,
 *                       a toggles the annunciator, r requests assistance on
 *                       the selected passage (never on one chosen for you)
 */
function routeKey(ev, ctx) {
  const k = ev.key;
  const mod = !!(ev.metaKey || ev.ctrlKey);
  const shift = !!ev.shiftKey;
  const c = ctx || {};

  /* NOBODY ELSE'S FIELD, BUT THE APP'S OWN. Enter and Escape belong to the
     proposal editor while it is open — that is the one place the caret must not
     be hijacked — and every other key is typing, including Mod+Z (the writer's
     words, not the edit stack). Checked BEFORE the `editing` guard below,
     because the editor is inside the app and the browser's caret is its own. */
  if (c.editingProposal) {
    if (mod) return 'passthrough';
    if (k === 'Enter') return 'proposal.commit';
    if (k === 'Escape') return 'proposal.abandon';
    return 'passthrough';
  }

  if (c.editing) return 'passthrough';

  if (mod && (k === 'z' || k === 'Z')) return shift ? 'edits.redo' : 'edits.undo';
  if (mod) return 'passthrough';

  if (k === 'Escape') {
    if (c.casting) return 'cast.cancel';
    if (c.foldOpen) return 'fold.close';
    if (c.onHorizon) return 'focus.release';
    return 'fold.closeAll';
  }

  if (c.casting) {
    if (k === 'j' || k === 'J' || k === 'ArrowRight') return 'cast.next';
    if (k === 'k' || k === 'K' || k === 'ArrowLeft') return 'cast.prev';
    if (k === 'v') return 'rehearse.toggle';
    if (k === 'e') return 'proposal.edit';
    if (k === 'Enter') return 'cast.apply';
    if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'PageDown' || k === 'PageUp') return 'cast.abandon';
    return 'passthrough';
  }

  if (c.onHorizon) {
    if (k === 'ArrowDown') return 'hz.next';
    if (k === 'ArrowUp') return 'hz.prev';
    if (k === 'Home') return 'hz.first';
    if (k === 'End') return 'hz.last';
    if (k === 'Enter' || k === ' ') return 'hz.jump';
    return 'passthrough';
  }

  if (k === 'ArrowDown') return 'row.next';
  if (k === 'ArrowUp') return 'row.prev';
  if (k === 'Enter') return c.foldOpen ? 'fold.close' : 'fold.toggle';
  // J/K are inert on the page and alive inside an open fold: that is how casting
  // begins. A fold that is open is a line that is asking to be rewritten.
  if (k === 'j' || k === 'J') return c.foldOpen ? 'cast.begin.next' : 'passthrough';
  if (k === 'k' || k === 'K') return c.foldOpen ? 'cast.begin.prev' : 'passthrough';
  // `r` = request assistance on the passage the writer has selected. It is the
  // escape hatch from "no target is chosen for you": automatic targeting stays
  // refused, explicit assistance is honoured, warning retained.
  if (k === 'r') return c.foldOpen ? 'cast.request' : 'passthrough';
  if (k === 'v') return c.foldOpen ? 'rehearse.toggle' : 'passthrough';
  // Visit the other scene a finding cites — and come back. The graph is deferred;
  // navigation between cited passages is the cheap version of the same need.
  /* Leaving a visit is a property of the VISIT, not of the row it landed on —
     the landing place is by definition a place with nothing on it, so O must
     still route while a return is outstanding. (While a proposal is open, the
     casting block above has already claimed the key.) */
  if (k === 'o') return (c.foldOpen || c.roaming) ? 'roam.toggle' : 'passthrough';
  // The context filter: which critique is allowed to speak up, never which prose.
  if (k === 'f') return 'scope.cycle';
  if (k === 'n') return 'wet.next';
  if (k === 'p') return 'wet.prev';
  if (k === '[') return 'ink.down';
  if (k === ']') return 'ink.up';
  if (k === 'a') return 'announce.toggle';   // the annunciator is a place you can live
  // The ground is not a theme picker: it is the same instrument on two benches,
  // and comparing them is how the register was chosen. One key, reversible, and
  // it announces which bench you are on.
  if (k === 'g') return 'ground.toggle';
  if (k === 'Home') return 'row.first';
  if (k === 'End') return 'row.last';
  return 'passthrough';
}

   1 · SOURCES — the only place the network exists
   Two adapters, one interface. The spatial code below never knows which is
   live; swapping adapters changes no layout, no key, no geometry.
