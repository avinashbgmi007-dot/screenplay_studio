name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    # Pinned, not ubuntu-latest: the 24.04 -> 26.04 migration moves
    # unattended, and apt package names drift with it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # PINNED, for the same reason `runs-on` is pinned below: a floating
        # linter means a new ruff release can add a rule and turn a green build
        # red with no code change — or, worse, the lint gate starts disagreeing
        # with the developer's own `ruff check .`. Keep this in step with the
        # `ruff` pin in pyproject.toml's `dev` / `ci` extras.
        run: pip install "ruff==0.16.8"
      - name: Lint
        run: ruff check .

  test-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The `apt-get install tesseract-ocr …` step that stood here is GONE, and it
      # must not come back without also adding `pytesseract` to the `ci` extra.
      #
      # It was dead weight that could cancel the entire job. Measured 2026-10-07: it
      # stalled inside `apt-get update` for 25.3 min — the job budget — against a
      # normal 30 s, so `test-python` was CANCELLED with `setup-python`, `Install
      # dependencies` and `Run test suite` all SKIPPED. The suite never ran, and the
      # result read as a flake. The log's last line before 24 min of silence was a
      # half-finished `Get: … noble-security InRelease [126 kB]`; apt has no acquire
      # timeout by default, so a dead socket blocks forever.
      #
      # Nothing needed the binary:
      #   * `pytesseract` and `easyocr` are NOT dependencies of this project, so
      #     `pdf_parser._get_ocr_engine()` returns None in CI either way (verified:
      #     both raise ModuleNotFoundError, engine is None);
      #   * `tests/test_pdf_ocr.py` monkeypatches `_get_ocr_engine` and says so in
      #     its own docstring — "the real OCR stack is optional and
      #     machine-dependent" (measured: 5 passed in 1.8 s with no engine).
      # So the step bought no coverage and cost a 25-minute stall surface on the
      # critical path. Real OCR is UNTESTED in CI, and already was; making it tested
      # is a separate decision (add pytesseract + bound this step).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # The package is buildable (build-system pinned), so CI installs the
        # declared runtime + test extras from one source of truth. The lock is
        # applied as a CONSTRAINTS file (`-c`), not a second requirements list:
        # pyproject decides which packages exist, requirements.lock.txt decides
        # which versions. Without this the declared `>=` floors mean CI and a
        # developer can install different versions of the same dependency and
        # disagree about a green build — the same class of hole as the floating
        # ruff pin in the `lint` job above.
        run: pip install ".[ci]" -c requirements.lock.txt
      - name: Run test suite
        # E2E-5 (audit 2026-09-24): pytest-cov was declared and installed but no
        # job ever ran with --cov, and there was no floor — coverage could fall
        # anywhere and nothing would say so. Measured at this revision: 87%.
        # `[tool.coverage.run] source` decides what is measured, so this bare
        # `--cov` and a developer's local run produce the same number, and
        # `fail_under = 85` in pyproject.toml is the ratchet.
        run: pytest -q --cov --cov-report=term

  test-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JS test dependencies
        run: npm ci
      # Gate 2. This job used to run only `tests/js/*.test.js` (17 tests). The
      # ink-layer suite — preview-ink-layer/tests/{core,dom}.test.mjs (62 + 48) —
      # imports `jsdom`, which was UNDECLARED and had no package.json to declare
      # it in, so a clean checkout could not run it and CI never did. Worse, it
      # had been broken on any Node >= 21 since Node added a getter-only
      # `globalThis.navigator`; nobody saw it because it never ran here.
      # Measured 2026-10-07: 127 tests, 127 pass. The file list lives in
      # package.json's `test` script so CI and a local `npm test` cannot drift.
      - name: Run JS unit tests
        run: npm test

  # The SPA is ~9k lines of vanilla app.js (plus 6.5k of CSS) with no build step
  # and, until 2026-09-20, no automated coverage in CI at all: the 29
  # tests/e2e_browser_*.py suites were run by hand and are invisible to pytest
  # (they do not match test_*.py). This job is that missing gate. Measured on
  # 2026-09-25: 49 suites, 48 pass / 0 fail / 1 skip, 1,235 checks, against a
  # real chromium. The one skip is `gun_pen_audit`, which POSTs a live /analyze
  # and needs a llama-server CI does not have — so a check that exists only
  # there is NOT covered by this job, whatever its local status. Keep the
  # runner's exit code honest: it fails the job on any suite that fails or
  # crashes.
  test-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[ci]" -c requirements.lock.txt
      - name: Install chromium
        # `--with-deps` shells out to apt, and this step stalled for the FULL
        # 45-minute job budget on 2026-10-07 (normal: well under a minute),
        # cancelling `test-browser` and SKIPPING `Run browser suites` — so the
        # browser fleet silently did not run and the result looked like a flake.
        # A step-level bound makes that a fast, honest step failure instead.
        #
        # Note this is the second instance of one cause: the two long jobs each had
        # exactly one unbounded network fetch on the critical path, and both stalled
        # on it (`apt-get update` 25.3 min here, `playwright install` 45 min). The
        # pip/npm installs are left alone because pip and npm bound their own
        # connections (pip: 15 s connect timeout + retries), so they already fail
        # rather than hang.
        timeout-minutes: 8
        run: python -m playwright install --with-deps chromium
      - name: Run browser suites
        run: python tests/run_browser_suites.py

  # BE-4 (audit 2026-09-24): the shipping platform is Windows, and every job above
  # runs ubuntu-24.04 — so the Windows branch of the app's platform-specific
  # mechanisms never ran unattended:
  #
  #   * `jsonio`'s cross-process lock is `msvcrt.locking` on Windows and
  #     `fcntl.flock` everywhere else, so CI only ever exercised the fcntl branch;
  #   * `TestDeleteSurvivesAWindowsLock` is `skipif(os.name != "nt")` — for a
  #     legitimate reason (POSIX unlinks open files, so the race cannot exist
  #     there) — which meant the one test covering the Windows delete-retry
  #     defect was permanently skipped in the only place the suite runs by itself.
  #
  # Scoped to the store/lock/delete paths rather than the whole suite on purpose:
  # those are the files whose behaviour is platform-dependent, and duplicating the
  # ubuntu run would cost 25 minutes for no new signal. Widen to `pytest -q` once
  # this job has a green baseline.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[ci]" -c requirements.lock.txt
      - name: Run the platform-specific store, lock and delete tests
        run: >
          pytest -q
          tests/test_delete_project.py
          tests/test_delete_retry.py
          tests/test_store_concurrency.py
          tests/test_store_fault_injection.py
          tests/test_report_atomicity.py
          tests/test_undo_redo.py
          tests/test_undo_redo_lock_race.py
          tests/test_revision.py
          tests/test_webapp_revision.py
          tests/test_stash.py
